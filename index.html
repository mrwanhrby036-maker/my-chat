<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>My Chat</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<main class="app">

    <section class="login-screen" id="loginScreen">

        <div class="login-card">

            <div class="logo">
                💬
            </div>

            <h1>My Chat</h1>

            <p>اكتب اسمك وادخل الشات</p>

            <form id="loginForm">

                <input
                    type="text"
                    id="username"
                    placeholder="اكتب اسمك"
                    maxlength="30"
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    دخول
                </button>

            </form>

            <p id="loginError" class="error"></p>

        </div>

    </section>


    <section class="chat-screen" id="chatScreen" hidden>

        <header class="chat-header">

            <div>
                <strong>💬 My Chat</strong>
                <span id="currentUser"></span>
            </div>

        </header>


        <div id="messages" class="messages">
        </div>


        <form id="messageForm" class="message-form">

            <input
                type="text"
                id="messageInput"
                placeholder="اكتب رسالة..."
                autocomplete="off"
                maxlength="500"
                required
            >

            <button type="submit">
                إرسال
            </button>

        </form>

    </section>

</main>


<script src="app.js"></script>
```

</body>

</html>
